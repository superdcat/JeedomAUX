[smartclim]
; Doit rester identique à smartclim::INTERVALLE_DEFAUT (core/class/smartclim.class.php)
refresh_interval = 5
; Doit rester identique à smartclim::PAYS_DEFAUT (core/class/smartclim.class.php).
; C'est le seul défaut que voit config::byKeys(), donc le chargement AJAX du formulaire
; de configuration : sans cette ligne, la liste déroulante s'afficherait vide alors que
; le PHP, lui, retomberait sur PAYS_DEFAUT.
auxhome_country = FRA
; Doit rester identique à smartclimDemon::PORT_DEMON (core/class/smartclimDemon.class.php)
demon_port = 55112
; Doit rester identique à smartclim::REGION_DEFAUT (core/class/smartclim.class.php) et à
; une clé de smartclimAuxCloudApi::regions() (core/class/smartclimAuxCloudApi.class.php).
; C'est le seul défaut que voit config::byKeys(), donc le chargement AJAX du formulaire
; de configuration : sans cette ligne, la liste déroulante des régions s'afficherait vide
; alors que le PHP, lui, retomberait sur REGION_DEFAUT.
auxcloud_region = EU
